<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Chase Kendall — a personal index of places, projects, and ways to connect.">
    <meta name="color-scheme" content="dark light">
    <title>Chase Kendall</title>
    <link rel="icon" href="assets/icons/favicon-c.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@500,600&display=swap">
    <style>
      :root {
        --page: #050606;
        --board: #0a0b0c;
        --cell: #24272a;
        --cell-hover: #30353a;
        --ink: #ffffff;
        --muted: #ffffff;
        --line: rgba(255, 255, 255, 0.16);
        --hinge: rgba(0, 0, 0, 0.64);
        --blue: #9ed9ff;
        --gap: clamp(2px, 0.18vw, 3px);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--page);
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: "Switzer", "Helvetica Neue", Arial, sans-serif;
      }

      .vestaboard {
        width: min(520px, 34vw, calc(110svh - 26px));
        height: auto;
        aspect-ratio: 1.1;
        display: grid;
        grid-template-rows: repeat(14, minmax(0, 1fr));
        gap: var(--gap);
        padding: clamp(4px, 0.34vw, 7px);
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--board);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      }

      .vesta-row {
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(21, minmax(0, 1fr));
        gap: var(--gap);
        color: inherit;
        text-decoration: none;
      }

      .vesta-cell,
      .vesta-link-cell,
      .vesta-social-cell {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--cell);
        color: var(--muted);
        font-family: inherit;
        font-size: clamp(7px, 1.26vw, 18px);
        font-weight: 600;
        line-height: 1;
        text-transform: uppercase;
      }

      .vesta-cell,
      .vesta-social-cell {
        display: grid;
        place-items: center;
      }

      .vesta-cell {
        contain: layout paint;
        isolation: isolate;
      }

      .vesta-glyph,
      .vesta-link-glyph {
        transform: scaleX(1.08) scaleY(1.16);
        transform-origin: center;
      }

      .vesta-glyph {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform-style: preserve-3d;
      }

      .vesta-cell::after,
      .vesta-link-cell::after,
      .vesta-social-cell::after {
        content: "";
        position: absolute;
        z-index: 2;
        top: 50%;
        right: 0;
        left: 0;
        pointer-events: none;
        border-top: 1px solid var(--hinge);
        box-shadow: 0 -1px rgba(255, 255, 255, 0.04);
      }

      .vesta-row--name .has-character,
      .vesta-row--location .has-character {
        color: #ffffff;
      }

      .vesta-row--city .has-character {
        color: #ffffff;
      }

      .vesta-link-cell {
        display: grid;
        grid-template-columns: repeat(var(--character-count), minmax(0, 1fr));
        gap: var(--gap);
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
        outline: none;
        transition:
          color 160ms ease,
          background-color 160ms ease,
          border-color 160ms ease;
      }

      button.vesta-link-cell {
        width: auto;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;
        align-self: stretch;
        -webkit-appearance: none;
        appearance: none;
      }

      .vesta-link-glyph {
        display: flex;
        min-width: 0;
        height: 100%;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      .vesta-link-arrow {
        display: grid;
        min-width: 0;
        place-items: center;
        font-size: 1.2em;
      }

      .vesta-link-arrow-icon {
        width: 68%;
        height: 68%;
        object-fit: contain;
        filter:
          brightness(0)
          saturate(100%)
          invert(85%)
          sepia(18%)
          saturate(1438%)
          hue-rotate(176deg)
          brightness(103%)
          contrast(101%);
      }

      .vesta-link-cell--accent {
        color: var(--blue);
      }

      .vesta-link-cell:hover,
      .vesta-link-cell:focus-visible {
        border-color: rgba(158, 217, 255, 0.68);
        background: var(--cell-hover);
      }

      .vesta-link-cell:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }

      .vesta-social-cell {
        padding: 0;
        color: var(--ink);
        text-decoration: none;
        transition:
          background-color 160ms ease,
          border-color 160ms ease;
      }

      a.vesta-social-cell {
        cursor: pointer;
      }

      a.vesta-social-cell:hover,
      a.vesta-social-cell:focus-visible {
        border-color: rgba(158, 217, 255, 0.68);
        background: var(--cell-hover);
        outline: none;
      }

      a.vesta-social-cell:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }

      .vesta-social-cell--pending {
        opacity: 1;
      }

      .vesta-social-icon {
        z-index: 1;
        width: 62%;
        height: 62%;
        object-fit: contain;
        filter:
          brightness(0)
          saturate(100%)
          invert(85%)
          sepia(18%)
          saturate(1438%)
          hue-rotate(176deg)
          brightness(103%)
          contrast(101%);
      }

      .copy-toast {
        position: fixed;
        z-index: 10;
        left: 50%;
        bottom: clamp(18px, 4vh, 38px);
        padding: 9px 13px;
        border: 1px solid rgba(158, 217, 255, 0.7);
        border-radius: 2px;
        background: #111416;
        color: #9ed9ff;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1;
        text-transform: uppercase;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .copy-toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 680px) {
        :root {
          --gap: 2px;
        }

        .vestaboard {
          width: min(calc(100vw - 16px), calc(110svh - 18px));
          height: auto;
          padding: 4px;
        }

        .vesta-cell,
        .vesta-link-cell,
        .vesta-social-cell {
          font-size: clamp(7px, 3.7vw, 16px);
          border-radius: 1px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .copy-toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="vestaboard" id="vestaboard" aria-label="Chase Kendall personal index"></main>
    <div class="copy-toast" id="copy-toast" role="status" aria-live="polite"></div>

    <script>
      const COLUMN_COUNT = 21;
      const TEXT_START = 1;
      const CITY_PAUSE = 5200;
      const LETTER_FLIP_DURATION = 72;
      const COLUMN_PAUSE = 36;
      const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const cityNames = ["SAN FRANCISCO", "LOS ANGELES"];
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const board = document.querySelector("#vestaboard");
      const copyToast = document.querySelector("#copy-toast");
      let toastTimer;

      const rows = [
        { text: "" },
        { text: "CHASE KENDALL", className: "vesta-row--name" },
        { text: "" },
        { text: "LOCATION:", className: "vesta-row--location" },
        { text: cityNames[0], className: "vesta-row--city", isCity: true },
        { text: "" },
        {
          text: "COLLEGE ESSAY HELP",
          linkText: "ESSAY HELP",
          href: "essay-help.html",
          arrow: true
        },
        {
          text: "WORK WORTH SHARING",
          linkText: "WORK",
          href: "work.html"
        },
        {
          text: "CHECK OUT MY ",
          socials: [
            {
              name: "GitHub",
              href: "https://github.com/cmkendall",
              icon: "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/github.svg"
            },
            {
              name: "Instagram",
              href: "https://instagram.com/chasemkendall",
              icon: "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/instagram.svg"
            },
            {
              name: "Twitter",
              href: "https://x.com/cmkendall_",
              icon: "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/x.svg"
            },
            {
              name: "LinkedIn",
              href: "https://www.linkedin.com/in/chase-kendall-b5b2a1323",
              icon: "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/linkedin.svg"
            }
          ]
        },
        { text: "" },
        { text: "CONTACTS:" },
        { text: "PHONE NUMBER", copyText: "858-269-9504" },
        { text: "EMAIL", copyText: "chasekendall888@gmail.com" },
        { text: "" }
      ];

      const showCopyToast = (label) => {
        window.clearTimeout(toastTimer);
        copyToast.textContent = `${label} COPIED`;
        copyToast.classList.add("is-visible");

        toastTimer = window.setTimeout(() => {
          copyToast.classList.remove("is-visible");
        }, 1800);
      };

      const copyToClipboard = async (value, label) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(value);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = value;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.append(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
          }

          showCopyToast(label);
        } catch {
          copyToast.textContent = "COPY FAILED";
          copyToast.classList.add("is-visible");
          window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(() => {
            copyToast.classList.remove("is-visible");
          }, 1800);
        }
      };

      const paddedText = (text) => {
        const characters = Array(COLUMN_COUNT).fill("");

        [...text].slice(0, COLUMN_COUNT - TEXT_START).forEach((character, index) => {
          characters[index + TEXT_START] = character;
        });

        return characters;
      };

      const createCell = (character) => {
        const cell = document.createElement("span");
        const glyph = document.createElement("span");
        cell.className = "vesta-cell";
        glyph.className = "vesta-glyph";
        cell.setAttribute("aria-hidden", "true");
        glyph.textContent = character;
        cell.append(glyph);

        if (character) {
          cell.classList.add("has-character");
        }

        return cell;
      };

      const createSocialCell = (social) => {
        const cell = document.createElement(social.href ? "a" : "span");
        const icon = document.createElement("img");
        cell.className = "vesta-social-cell";
        icon.className = "vesta-social-icon";
        icon.src = social.icon;
        icon.alt = "";
        icon.setAttribute("aria-hidden", "true");
        cell.setAttribute(
          "aria-label",
          social.href ? social.name : `${social.name} link coming soon`
        );

        if (social.href) {
          cell.href = social.href;
          cell.target = "_blank";
          cell.rel = "noreferrer";
        } else {
          cell.classList.add("vesta-social-cell--pending");
          cell.setAttribute("role", "img");
        }

        cell.append(icon);
        return cell;
      };

      const createRow = (row) => {
        const element = document.createElement("div");
        element.className = `vesta-row ${row.className || ""}`;

        if (row.socials) {
          for (let column = 0; column < TEXT_START; column += 1) {
            element.append(createCell(""));
          }

          [...row.text].forEach((character) => {
            element.append(createCell(character));
          });

          row.socials.forEach((social) => {
            element.append(createSocialCell(social));
          });

          const remainingColumns = (
            COLUMN_COUNT -
            TEXT_START -
            row.text.length -
            row.socials.length
          );

          for (let column = 0; column < remainingColumns; column += 1) {
            element.append(createCell(""));
          }
        } else if (row.href || row.copyText) {
          const visibleText = [...row.text].slice(0, COLUMN_COUNT - TEXT_START).join("");
          const linkText = row.linkText || visibleText;
          const linkStart = visibleText.indexOf(linkText);
          const leadingCharacters = [...visibleText.slice(0, linkStart)];
          const linkCharacters = [...linkText];
          const trailingCharacters = [...visibleText.slice(linkStart + linkText.length)];
          const linkSpan = linkCharacters.length + (row.arrow ? 1 : 0);

          for (let column = 0; column < TEXT_START; column += 1) {
            element.append(createCell(""));
          }

          leadingCharacters.forEach((character) => {
            element.append(createCell(character));
          });

          const link = document.createElement(row.copyText ? "button" : "a");
          link.className = "vesta-link-cell";
          link.classList.toggle(
            "vesta-link-cell--accent",
            Boolean(row.linkText || row.copyText)
          );
          link.style.gridColumn = `${TEXT_START + leadingCharacters.length + 1} / span ${linkSpan}`;
          link.style.setProperty("--character-count", linkSpan);

          if (row.copyText) {
            link.type = "button";
            link.setAttribute("aria-label", `Copy ${row.text.toLowerCase()}`);
            link.addEventListener("click", () => {
              copyToClipboard(row.copyText, row.text);
            });
          } else {
            link.href = row.href;
            link.setAttribute("aria-label", linkText);

            if (row.external) {
              link.target = "_blank";
              link.rel = "noreferrer";
            }
          }

          linkCharacters.forEach((character) => {
            const glyph = document.createElement("span");
            glyph.className = "vesta-link-glyph";
            glyph.setAttribute("aria-hidden", "true");
            glyph.textContent = character;
            link.append(glyph);
          });

          if (row.arrow) {
            const arrow = document.createElement("span");
            const arrowIcon = document.createElement("img");
            arrow.className = "vesta-link-arrow";
            arrow.setAttribute("aria-hidden", "true");
            arrowIcon.className = "vesta-link-arrow-icon";
            arrowIcon.src = "https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/move-up-right.svg";
            arrowIcon.alt = "";
            arrow.append(arrowIcon);
            link.append(arrow);
          }

          element.append(link);

          trailingCharacters.forEach((character) => {
            element.append(createCell(character));
          });

          const usedColumns = (
            TEXT_START +
            leadingCharacters.length +
            linkSpan +
            trailingCharacters.length
          );
          const remainingColumns = COLUMN_COUNT - usedColumns;

          for (let column = 0; column < remainingColumns; column += 1) {
            element.append(createCell(""));
          }
        } else {
          paddedText(row.text).forEach((character) => {
            element.append(createCell(character));
          });
        }

        if (!row.href && !row.copyText && row.text) {
          const accessibleText = document.createElement("span");
          accessibleText.className = "sr-only";
          accessibleText.textContent = row.text;
          element.append(accessibleText);
        }

        board.append(element);
        return element;
      };

      let cityRow;

      rows.forEach((row) => {
        const element = createRow(row);

        if (row.isCity) {
          cityRow = element;
          cityRow.setAttribute("role", "status");
          cityRow.setAttribute("aria-live", "polite");
        }
      });

      const cityCells = [...cityRow.querySelectorAll(".vesta-cell")];
      const cityStatus = cityRow.querySelector(".sr-only");
      let currentCityIndex = 0;

      const wait = (duration) => new Promise((resolve) => {
        window.setTimeout(resolve, duration);
      });

      const setCellCharacter = (cell, character) => {
        const glyph = cell.querySelector(".vesta-glyph");
        glyph.textContent = character;
        cell.classList.toggle("has-character", Boolean(character));
      };

      const flipCell = async (cell, character) => {
        const glyph = cell.querySelector(".vesta-glyph");
        const baseTransform = "scaleX(1.08) scaleY(1.16)";

        if (!glyph.animate) {
          await wait(LETTER_FLIP_DURATION / 2);
          setCellCharacter(cell, character);
          await wait(LETTER_FLIP_DURATION / 2);
          return;
        }

        const animation = glyph.animate(
          [
            { transform: `${baseTransform} rotateX(0deg)`, offset: 0 },
            { transform: `${baseTransform} rotateX(78deg)`, offset: 0.49 },
            { transform: `${baseTransform} rotateX(-78deg)`, offset: 0.5 },
            { transform: `${baseTransform} rotateX(0deg)`, offset: 1 }
          ],
          {
            duration: LETTER_FLIP_DURATION,
            easing: "linear"
          }
        );

        await wait(LETTER_FLIP_DURATION / 2);
        setCellCharacter(cell, character);

        try {
          await animation.finished;
        } catch {
          // Safari can cancel an animation when its text node changes.
        } finally {
          animation.cancel();
        }
      };

      const alphabetSequence = (
        currentCharacter,
        targetCharacter,
        forceFullCycle = false
      ) => {
        const currentIndex = currentCharacter
          ? alphabet.indexOf(currentCharacter)
          : -1;

        if (targetCharacter === "") {
          const sequenceToBlank = [];

          if (currentIndex >= 0) {
            for (
              let index = currentIndex + 1;
              index < alphabet.length;
              index += 1
            ) {
              sequenceToBlank.push(alphabet[index]);
            }
          }

          sequenceToBlank.push("");
          return sequenceToBlank;
        }

        if (targetCharacter === " ") {
          return [" "];
        }

        const targetIndex = alphabet.indexOf(targetCharacter);
        const sequence = [];

        if (forceFullCycle && currentIndex >= 0 && currentIndex === targetIndex) {
          for (let offset = 1; offset <= alphabet.length; offset += 1) {
            sequence.push(alphabet[(currentIndex + offset) % alphabet.length]);
          }

          return sequence;
        }

        if (currentIndex === -1) {
          const distanceFromStart = targetIndex + 1;
          const distanceFromEnd = alphabet.length - targetIndex;

          if (distanceFromStart <= distanceFromEnd) {
            for (let index = 0; index <= targetIndex; index += 1) {
              sequence.push(alphabet[index]);
            }
          } else {
            for (let index = alphabet.length - 1; index >= targetIndex; index -= 1) {
              sequence.push(alphabet[index]);
            }
          }

          return sequence;
        }

        const forwardDistance = (targetIndex - currentIndex + alphabet.length) % alphabet.length;
        const backwardDistance = (currentIndex - targetIndex + alphabet.length) % alphabet.length;
        const direction = forwardDistance <= backwardDistance ? 1 : -1;
        let index = currentIndex;

        while (index !== targetIndex) {
          index = (index + direction + alphabet.length) % alphabet.length;
          sequence.push(alphabet[index]);
        }

        return sequence;
      };

      const cycleCellToCharacter = async (
        cell,
        currentCharacter,
        targetCharacter,
        forceFullCycle = false
      ) => {
        const sequence = alphabetSequence(
          currentCharacter,
          targetCharacter,
          forceFullCycle
        );

        for (const character of sequence) {
          await flipCell(cell, character);
        }
      };

      const shouldCycleCityCell = (currentCharacter, targetCharacter) => (
        currentCharacter !== targetCharacter ||
        (currentCharacter === "S" && targetCharacter === "S")
      );

      const transitionCity = async () => {
        const nextCityIndex = (currentCityIndex + 1) % cityNames.length;
        const currentCharacters = paddedText(cityNames[currentCityIndex]);
        const nextCharacters = paddedText(cityNames[nextCityIndex]);
        const changedColumns = [];

        for (let column = 0; column < COLUMN_COUNT; column += 1) {
          if (shouldCycleCityCell(currentCharacters[column], nextCharacters[column])) {
            changedColumns.push(column);
          }
        }

        if (REDUCED_MOTION) {
          changedColumns.forEach((column) => {
            setCellCharacter(cityCells[column], nextCharacters[column]);
          });
        } else {
          for (const column of changedColumns) {
            await cycleCellToCharacter(
              cityCells[column],
              currentCharacters[column],
              nextCharacters[column],
              currentCharacters[column] === nextCharacters[column]
            );

            await wait(COLUMN_PAUSE);
          }
        }

        changedColumns.forEach((column) => {
          if (cityCells[column].querySelector(".vesta-glyph").textContent !== nextCharacters[column]) {
            setCellCharacter(cityCells[column], nextCharacters[column]);
          }
        });

        currentCityIndex = nextCityIndex;
        cityStatus.textContent = cityNames[currentCityIndex];
        window.setTimeout(transitionCity, CITY_PAUSE);
      };

      window.setTimeout(transitionCity, CITY_PAUSE);
    </script>
  </body>
</html>
