<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Selected work by Chase Kendall.">
    <title>Work — Chase Kendall</title>
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap">
    <style>
      :root {
        --paper: #f2f1ec;
        --ink: #111315;
        --blue: #add8f2;
        --blue-dark: #78bce7;
        --pad: clamp(18px, 2.2vw, 34px);
      }

      * { box-sizing: border-box; }

      html {
        background: var(--paper);
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        background: var(--paper);
        font-family: "Switzer", "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.55;
      }

      a { color: inherit; }

      a:focus-visible {
        outline: 2px solid var(--blue-dark);
        outline-offset: 4px;
      }

      .site-header {
        position: sticky;
        z-index: 10;
        top: 0;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        min-height: 62px;
        padding: 0 var(--pad);
        border-bottom: 1px solid var(--ink);
        background: rgba(242, 241, 236, 0.94);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .site-header a {
        text-decoration: none;
      }

      .site-nav {
        display: flex;
        grid-column: 2;
        gap: clamp(16px, 2vw, 32px);
      }

      .site-nav a[aria-current="page"] {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }

      main {
        flex: 1;
      }

      .page-heading {
        padding: clamp(38px, 5vw, 72px) var(--pad) clamp(30px, 4vw, 52px);
        border-bottom: 1px solid var(--ink);
        background-color: #fbfbf8;
        background-image: repeating-linear-gradient(
          -45deg,
          transparent 0,
          transparent 20px,
          rgba(96, 100, 103, 0.22) 20px,
          rgba(96, 100, 103, 0.22) 21px
        );
      }

      h1 {
        margin: 0;
        font-size: clamp(58px, 9vw, 132px);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 0.82;
        text-transform: uppercase;
      }

      .work-field {
        min-height: 58svh;
        display: grid;
        grid-template-columns: minmax(210px, 0.36fr) minmax(0, 1fr);
        border-bottom: 1px solid var(--ink);
        background: var(--paper);
      }

      .work-title {
        margin: 0;
        padding: 52px var(--pad);
        border-right: 1px solid var(--ink);
        background: var(--blue);
        font-size: clamp(27px, 3.3vw, 52px);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 0.95;
        text-transform: uppercase;
      }

      .video-panel {
        display: grid;
        align-items: center;
        padding: clamp(28px, 5vw, 72px);
        background-color: rgba(242, 241, 236, 0.96);
        background-image:
          linear-gradient(to right, rgba(17, 19, 21, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(17, 19, 21, 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .video-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--ink);
        background: #000;
      }

      .video-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 28px var(--pad);
        background: var(--ink);
        color: var(--paper);
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      footer a {
        color: var(--blue);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 560px) {
        .site-nav {
          gap: 14px;
        }

        footer {
          flex-direction: column;
        }
      }

      @media (max-width: 760px) {
        .work-field {
          grid-template-columns: 1fr;
        }

        .work-title {
          border-right: 0;
          border-bottom: 1px solid var(--ink);
        }

        .video-panel {
          padding: 28px var(--pad) 40px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="essay-help.html">Essay Help</a>
        <a href="work.html" aria-current="page">Work</a>
      </nav>
    </header>

    <main>
      <header class="page-heading">
        <h1>Work</h1>
      </header>

      <section class="work-field" aria-labelledby="salutatorian-video-title">
        <h2 class="work-title" id="salutatorian-video-title">Salutatorian Intro Video</h2>
        <div class="video-panel">
          <div class="video-frame">
            <iframe
              src="https://www.youtube.com/embed/fsXICTtGIP4?rel=0"
              title="Salutatorian Intro Video"
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>Chase Kendall / Work</span>
      <a href="index.html">Return to index ↑</a>
    </footer>
  </body>
</html>
